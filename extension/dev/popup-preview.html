<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Popup preview</title>
    <!-- Dev only: every popup state side by side, drawn with the real view and CSS.
         Run `npm run preview:popup` in extension/ and open /dev/popup-preview.html -->
    <link rel="stylesheet" href="../src/popup.css" />
    <style>
      body { width: auto; padding: 24px; background: #e9e9e9; }
      .grid { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
      .frame { width: 300px; background: var(--bg); box-shadow: 0 4px 16px rgba(0,0,0,.18); border-radius: 8px; overflow: hidden; }
      .label { font: 12px ui-monospace, monospace; color: #555; margin: 0 0 6px; }
      @media (prefers-color-scheme: dark) { body { background: #0d0d0d; } .label { color: #aaa; } }
    </style>
  </head>
  <body>
    <div class="grid" id="grid"></div>
    <script type="module">
      import { renderPopup } from '../src/popupView.js'

      const now = Date.now()
      const connected = { state: 'connected', workspaceName: "Durva's Notion" }
      const states = {
        checking: null,
        'connected, nothing synced': { connection: connected, lastSync: null },
        'connected, synced': { connection: connected, lastSync: { ok: true, updated: 2, at: now - 180000 } },
        'sync failed': { connection: connected, lastSync: { ok: false, error: '429: rate limited', at: now } },
        'not connected': { connection: { state: 'disconnected' }, lastSync: null },
        'backend offline': { connection: { state: 'offline' }, lastSync: null },
      }
      const noop = () => {}

      for (const [label, view] of Object.entries(states)) {
        const wrap = document.createElement('div')
        wrap.innerHTML = `<p class="label"></p><div class="frame"><header class="brand"><span class="logo">&lt;/&gt;</span><span>Notion AutoLang</span></header><main></main></div>`
        wrap.querySelector('.label').textContent = label
        renderPopup(wrap.querySelector('main'), view, { connect: noop, disconnect: noop, retry: noop }, { now })
        document.getElementById('grid').append(wrap)
      }
    </script>
  </body>
</html>
