
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Notion AutoLang</title>

  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <main class="container">

    <header>
      <div class="brand">
        <span class="logo">{ }</span>

        <div>
          <h1>AutoLang</h1>
          <p>Language detection for Notion</p>
        </div>
      </div>

      <span class="version">v0.1</span>
    </header>

    <section class="actions">
      <button id="scanBtn" class="primary">
        Scan code blocks
      </button>

      <p id="status" role="status">
        Open a Notion page to get started.
      </p>
    </section>

    <section class="results">
      <div class="section-header">
        <h2>Detected blocks</h2>
        <span id="blockCount">0</span>
      </div>

      <div id="blockList" class="block-list">
        <p class="empty">
          No blocks scanned yet.
        </p>
      </div>
    </section>

    <footer>
      <button id="applyBtn" disabled>
        Apply selected suggestions
      </button>

      <p>Code is processed locally.</p>
    </footer>

  </main>

  <script src="popup.js"></script>
</body>
</html>
